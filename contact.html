<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Henry Solorzano</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .contact-page {
            min-height: 100vh;
        }

        .contact-wrapper {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: calc(var(--spacing-xl) + 80px) var(--spacing-lg) var(--spacing-xl);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: var(--spacing-xl);
            align-items: start;
            width: 100%;
        }

        .contact-image {
            position: sticky;
            top: calc(var(--spacing-xl) + 80px);
        }

        .contact-image img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        .contact-image img.loaded {
            opacity: 1;
        }

        .contact-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 60vh;
        }

        .contact-intro {
            margin-bottom: var(--spacing-xl);
        }

        .contact-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            margin-bottom: var(--spacing-lg);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }

        .contact-subtitle {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 300;
            color: var(--color-text-muted);
            line-height: 1.8;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .contact-link-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .contact-link-item:nth-child(1) { animation-delay: 0.6s; }
        .contact-link-item:nth-child(2) { animation-delay: 0.75s; }

        .contact-link-label {
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--color-text-subtle);
            margin-bottom: var(--spacing-xs);
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-family: var(--font-display);
            font-size: clamp(1.25rem, 2.5vw, 1.75rem);
            font-weight: 300;
            color: var(--color-text);
            position: relative;
            transition: color var(--transition-fast);
        }

        .contact-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--color-text);
            transition: width var(--transition-medium);
        }

        .contact-link:hover {
            color: var(--color-text-muted);
        }

        .contact-link:hover::after {
            width: 100%;
        }

        .contact-link svg {
            width: 20px;
            height: 20px;
            opacity: 0.6;
            transition: opacity var(--transition-fast), transform var(--transition-fast);
        }

        .contact-link:hover svg {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Tablet */
        @media (max-width: 1200px) {
            .contact-grid {
                gap: var(--spacing-lg);
            }
        }

        /* Mobile */
        @media (max-width: 900px) {
            .contact-wrapper {
                padding-top: calc(var(--spacing-lg) + 80px);
                align-items: flex-start;
            }

            .contact-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-lg);
            }

            .contact-image {
                position: static;
                max-width: 400px;
            }

            .contact-content {
                min-height: auto;
            }
        }

        @media (max-width: 600px) {
            .contact-wrapper {
                padding: calc(var(--spacing-md) + 80px) var(--spacing-md) var(--spacing-lg);
            }

            .contact-link {
                font-size: 1.1rem;
            }

            .contact-link svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body class="contact-page">
    <!-- Header -->
    <header class="site-header">
        <nav class="nav-container">
            <a href="index.html" class="logo">Henry Solorzano</a>
            <div class="nav-links" id="navLinks">

                        <line x1="12" y1="21" x2="12" y2="23"/>

        </nav>
    </header>
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Contact Content -->
    <main class="contact-wrapper">
        <div class="contact-grid">
            <div class="contact-image">
                <img src="" alt="" id="contactImage">
            </div>
            <div class="contact-content">
            <div class="contact-intro">
                <h1 class="contact-title">Let's Connect</h1>
                <p class="contact-subtitle">
                    Whether you have a question, want to collaborate, or just want to say hello — I'd love to hear from you.
                </p>
            </div>

            <div class="contact-links">
                <div class="contact-link-item">
                    <p class="contact-link-label">Email</p>
                    <a href="mailto:hello@henrysolorzano.com" class="contact-link">
                        hello@henrysolorzano.com
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </a>
                </div>

                <div class="contact-link-item">
                    <p class="contact-link-label">Instagram</p>
                    <a href="https://www.instagram.com/instagramfiction" target="_blank" rel="noopener" class="contact-link">
                        @instagramfiction
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
